[package]
name = "docpack"
version = "1.0.0"
edition = "2021"
description = "Pack directories and files into a single DOCX for AI chat upload — and unpack them back"
authors = ["bobwen-dev"]
license = "MIT"
repository = "https://github.com/bobwen-dev/docpack"
homepage = "https://github.com/bobwen-dev/docpack"
readme = "README.md"
keywords = ["docx", "pack", "unpack", "codebase", "ai-context", "chatgpt", "claude", "document"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["icon-large.png"]

[lib]
crate-type = ["lib"]

[dependencies]
eframe = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
image = "0.25"
walkdir = "2"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
