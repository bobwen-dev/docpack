[package]
name = "docpack"
version = "1.0.0"
edition = "2021"
description = "Pack directories/files into DOCX documents"
authors = ["DocPack"]

[lib]
crate-type = ["lib"]

[dependencies]
eframe = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
image = "0.25"
walkdir = "2"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
